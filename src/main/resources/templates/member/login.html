<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{top::menu}"></div>
<title>login</title>
<body>

<div>
    <span><h1>LOGIN</h1></span>
    <form th:action="@{/go_login}" method="post">
        <div>
            <label>ID: </label>
            <input type="text" id="id" name="id" placeholder="아이디를 입력하세요."/>
        </div>
        <div>
            <label>PW: </label>
            <input type="password" id="pw" name="pw" placeholder="비밀번호를 입력하세요."/>
        </div>
        <button type="submit">로그인</button>
    </form>

    <hr/>
    <p>또는 소셜 계정으로 로그인</p>

    <div class="social-login-area">
        <a href="/oauth2/authorization/kakao">
            <img src="/image/kakao_login_medium_narrow.png" alt="카카오 로그인" style="width:200px; cursor: pointer;"/>
        </a>
    </div>
</div>

</body>
</html>
